<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarqueeTag</title>
</head>
<body>
    <marquee behavior="" direction="" style="color: white;background-color: red;width: 50%;">
        <b style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-size: 75px;">Scrollable content</b>
    </marquee>
    <marquee behavior="" direction="up" style="width: 50%;background-color: lightgray;">
        <p>
            WebDevelopement is the process of the designing and developing the front-end of the webpages
            by using HTML,CSS,JavaScript and ReactJavaScript.
        </p>

    </marquee>

</body>
</html>
