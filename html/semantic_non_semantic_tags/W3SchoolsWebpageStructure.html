<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W3SchoolsWebpageStructure</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;font-weight: bold;text-align: center;">
    <header style="width: 100%;height: 50px;background-color: lightgray;font-size: 35px;">Header</header>
    <nav style="width: 100%;height: 70px;background-color: hotpink;">Navigation Bar</nav>
    <aside style="width: 25%;height: 350px;background-color: orange;float: left;">Aside</aside>
    <main style="width: 50%;height: 350px; float: left;">
        <article style="width: 100%;height: 100%;background-color: peachpuff;">
            <section style="width: 100%;height: 25%;background-color: lightblue;">Section</section>
            <figure style="width: 80%;height: 50%;color: white;background-color: navy;">Figure</figure>

        </article>
    </main>

    <aside style="width: 25%;height: 350px;background-color: orange;float: right;">Aside</aside>
    <footer style="background-color: black;width: 100%;height: 200px;color: white;float: left;">Footer</footer>
</body>
</html>
