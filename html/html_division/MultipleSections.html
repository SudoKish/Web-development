<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Sections </title>
</head>
<body>
    <!-- parent for the page -->
    <div style="width: 100%; height: 750px;background-color: aliceblue;">
        <h1 style="margin:0;width:100%;height: 15%;background-color: lightgray;text-align: center;font-size: 50px;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Header</h1>

        <!-- Parent for the aside one  -->
        <div style="width:30%;height: 70%;float: left;">
            <div style="height: 50%;background-color:aliceblue;font-size: 50px;text-align: center;">Aside One</div>
            <div style="height: 50%;background-color:navy;font-size: 50px;text-align: center;">Aside Two</div>

        </div>

        <!-- Parent For the Ds -->
         <div style="width: 70%;height: 70%;float: right">
            <!-- First Row Content -->
            <div style="width:25%;height:33.3%;background-color:sandybrown;font-size: 50px;text-align: center;float: left;">DOne</div>
            <div style="width:25%;height:33.3%;background-color:burlywood;font-size: 50px;text-align: center;float: left;">DTwo</div>
            <div style="width:25%;height:33.3%;background-color:brown;font-size: 50px;text-align: center;float: left;">DThree</div>
            <div style="width:25%;height:33.3%;background-color:lightsalmon;font-size: 50px;text-align:center;float:left;">Dfour</div>
            <!-- Second ROw Content -->
            <div style="width:33.3%;height:33.3%;background-color:orange;font-size: 50px;text-align: center;float: left;">DFive</div>
            <div style="width:33.3%;height:33.3%;background-color:white;font-size: 50px;text-align: center;float: left;">DSix</div>
            <div style="width:33.3%;height:33.3%;background-color:green;font-size: 50px;text-align: center;float: left;">DSeven</div>
            <!-- Third Row Content -->
            <div style="width:20%;height:33.3%;background-color:white;font-size: 50px;text-align: center;float: left;">DEight</div>
            <div style="width:20%;height:33.3%;background-color:lightgray;font-size: 50px;text-align: center;float: left;">DNine</div>
            <div style="width:20%;height:33.3%;background-color:darkgray;font-size: 50px;text-align: center;float: left;">DTen</div>
            <div style="width:20%;height:33.3%;background-color:greenyellow;font-size: 50px;text-align: center;float: left;">DEleven</div>
            <div style="width:20%;height:33.3%;background-color:lightgray;font-size: 50px;text-align: center;float: left;">DTwelve</div>

         </div>

            <!-- Footer -->
        <div style="width:100%; height:15%; background:black; color:white; text-align:center; font-size:40px; clear:both;">
        Footer</div>

    </div>

    


</body>
</html>
