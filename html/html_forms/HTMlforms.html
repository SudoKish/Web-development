<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLForms</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
        <center>
            <form action="">
                <!-- form table -->
                <table>
                    <!-- Form table caption -->
                    <caption style="font-size:25px;color:white;background-color: purple;">Forms[type attributes]</caption>
                    <!-- form table body -->
                    <tbody>
                    <!-- form table body rows -->
                    <!-- first row -->
                        <tr>
                            <td><label for="">Username</label></td>
                            <td><input type="text" ></td>
                        </tr>
                    <!-- second row -->
                        <tr>
                            <td><label for="">Password</label></td>
                            <td><input type="password"></td>
                        </tr>
                    <!-- third row -->
                        <tr>
                            <td><label for="">EmailUsername</label></td>
                            <td><input type="email"></td>
                        </tr>
                    <!-- fourth row -->
                        <tr>
                            <td><label for="">MobileNumber</label></td>
                            <td><input type="tel"></td>
                        </tr>
                    <!-- fifth row -->
                        <tr>
                            <td><label for="">Age</label></td>
                            <td><input type="number"></td>
                        </tr>
                    <!-- sixth row -->
                        <tr>
                            <td><label for="">ChooseColor</label></td>
                            <td><input type="color"></td>
                        </tr>
                    <!-- seventh row -->
                        <tr>
                            <td><label for="">Brightness</label></td>
                            <td><input type="ranTimePickerge"></td>
                        </tr>
                    <!-- eighth  row -->
                        <tr>
                            <td><label for="">DatePicker</label></td>
                            <td><input type="date"></td>
                        </tr>
                    <!-- nineth row -->
                        <tr>
                            <td><label for="">MonthPicker</label></td>
                            <td><input type="month"></td>
                        </tr>
                    <!-- tenth row -->
                        <tr>
                            <td><label for="">WeekPicker</label></td>
                            <td><input type="week"></td>
                        </tr>
                    <!-- eleventh row -->
                        <tr>
                            <td><label for="">TimePicker</label></td>
                            <td><input type="time"></td>
                        </tr>
                    <!-- twelveth row -->
                        <tr>
                            <td><label for="">DateTimePicker</label></td>
                            <td><input type="datetime-local"></td>
                        </tr>
                    <!-- thirteenth row -->
                        <tr>
                            <td><label for="">UploadAudioFile</label></td>
                            <td><input type="file"></td>
                        </tr>
                    <!-- fourteenth row -->
                        <tr>
                            <td><label for="">Google</label></td>
                            <td><input type="search"></td>
                        </tr>
                    <!-- fifteenth row -->
                        <tr>
                            <td><label for="">Gender</label></td>
                            <td>
                                <input type="radio"name="gender"><label for="">Male</label>
                                <input type="radio"name="gender"><label for="">Female</label>
                                <input type="radio"name="gender"><label for="">Transgender</label>
                                <input type="radio"name="gender"><label for="">Transwomen</label>
                            </td>
                        </tr>
                    <!-- sixteenth row -->
                        <tr>
                            <td><label for="">SkillsSets</label></td>
                            <td>
                                <input type="checkbox"name="skillsSets"><label for="">HTML</label>
                                <input type="checkbox"name="skillsSets"><label for="">CSS</label>
                                <input type="checkbox"name="skillsSets"><label for="">JavaScript</label>
                                <input type="checkbox"name="skillsSets"><label for="">ReactJavaScript</label>
                            </td>
                        </tr>
                    <!-- seventeenth row -->
                        <tr>
                            <td><input type="submit"></td>
                            <td><input type="reset"></td>
                        </tr>
                </tbody>
            </table>
        </form>  
    </center>
</body>
</html>
