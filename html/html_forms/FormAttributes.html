<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormAttributes</title>
</head>
<body>
    <center>
        <form action="https://www.facebook.com/">
            <!-- form table -->
            <table>
                <!-- form table caption -->
                <caption style="background-color: black;color: orange;font-size: 30px;">FormAttributes</caption>
                <tbody>
                    <!--form table rows  -->
                    <!-- first row -->
                    <tr>
                        <td><label for="">Username</label></td>
                        <td><input type="text" name="username" id=""></td>
                    </tr>
                    <!-- second row -->
                    <tr>
                        <td><label for="">Password</label></td>
                        <td><input type="password" name="username" id=""></td>
                    </tr>
                    <!-- third row -->
                    <tr>
                        <td colspan="2">
                            <input style="width: 200px;height: 50px;font-size: 35px;font-weight: bold;background-color: green;color: white;" target="_blank" type="submit" value="Login">
                            <input style="width: 30px"type="image" src="../../assets/images/icon.png" alt="">
                            <a href="RegistrationForm.html">
                                <input style="width: 200px;height:50px;background-color: black;color: orange;font-size: 25px;" type="button" value="Register">
                            </a>
                            <input style="width: 200px;height: 50px;font-size: 35px;font-weight: bold;background-color: red;color: white;" target="_blank" type="reset" value="Cancel">
                            
                        </td>
                    </tr>
                </tbody>
            </table>
        </form>
    </center>
</body>
</html>
